name: fakultas_kopi_photobooth
description: SnapTechBooth - Multi-Tenant Self Service Photobooth Kiosk Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.3
  http: ^1.2.2

  # Local Storage
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0
  sqflite: ^2.3.2
  path_provider: ^2.1.3

  # UI & Media
  qr_flutter: ^4.1.0
  lottie: ^3.1.0
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  camera: ^0.11.0
  flutter_uvc_camera: ^1.0.0

  # Image Processing
  image: ^4.2.0

  # Printing & PDF Document Generation (Epson L8050 / Android Print Service)
  pdf: ^3.10.8
  printing: ^5.13.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  logger: ^2.3.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1

  # Code Generation support
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/mock/
